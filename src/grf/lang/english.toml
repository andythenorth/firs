[GLOBAL_PRAGMA]
grflangid = "0x01"
plural = "0"

[STR_GRF_NAME]
# only translate the FIRS name if it's strictly necessary for the language
base = "FIRS Industry Replacement Set"

[STR_GRF_DESC]
base = "{ORANGE}FIRS Industry Replacement Set{}{BLACK}Brought to you by andythenorth, FooBar, planetmaker, Terkhen and Yexo, with help from many others. {SILVER}See website for more information, including how to use FIRS. {BLACK}License: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximum distance of fishing grounds, oil rigs and dredging sites from the coast in tiles."

[STR_PARAM_DESC_ECONOMIES]
base = "Each economy provides a different combination of cargos and industries.{}{}For players who want simple gameplay, {SILVER}Basic {BLACK}economies contain fewer industries and cargos than other FIRS economies.{}{}The FIRS website provides detailed information about each economy."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximum coastal distance of marine industries in tiles"

[STR_PARAM_NAME_ECONOMIES]
base = "Economy"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "No limit"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Supply crates required for Enhanced primary production (default 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Supply crates required for Gung-ho primary production (default 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Farms, mines and similar industries will increase production when supply crates are delivered, first to {SILVER}Enhanced{BLACK}, and then to {SILVER}Gung-ho{BLACK}, if enough crates are delivered.  {}{}The default values are good, but if you need to, you can change them here.  {}{}Cargo requirements for port-type industries will be 8x the values set here."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Enhanced primary production level (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho primary production level (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Production at farms, mines and similar industries when supply requirements are met (as percentage of {SILVER}Normal {BLACK}production level)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Temperate Basic"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arctic Basic"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropic Basic"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "In A Hot Country"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Steeltown"

[STR_PARAM_NAME_OBJECTS]
base = "FIRS landscaping objects"

[STR_PARAM_DESC_OBJECTS]
base = "FIRS includes a set of landscaping objects, which players can place to make certain industries appear larger. Landscape object have no gameplay effect. Landscaping objects can be turned on or off."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(optional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(supplied)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Supply {WHITE}at least one {BLACK} required cargo for maximum production."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}For maximum production rate, supply {WHITE}both {BLACK}required cargos at least once every three minutes."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}For maximum production rate, supply {WHITE}all {BLACK}required cargos at least once every three minutes."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}For maximum production rate, supply {WHITE}at least two {BLACK}required cargos at least once every three minutes."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}For maximum production rate, supply {WHITE}at least three {BLACK}required cargos at least once every three minutes."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}Production is proportional to town population. At least {WHITE}{SIGNED_WORD} units{BLACK} and not more than {WHITE}{SIGNED_WORD} units{BLACK} of cargo will be produced every minute."

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}Current production: {YELLOW}Normal {}{}{BLACK}For {WHITE}Enhanced {BLACK}production deliver {SIGNED_WORD} crates of supplies at least once every three minutes.{}For {WHITE}Gung-ho {BLACK}production deliver {SIGNED_WORD} crates."

[STR_PRIMARY_PRODUCTION_2X]
base = "{BLACK}Current production: {YELLOW}Enhanced {}{}{BLACK}To keep this level, deliver {SIGNED_WORD} crates of supplies at least once every three minutes.{}For {WHITE}Gung-ho {BLACK}production deliver {SIGNED_WORD} crates."

[STR_PRIMARY_PRODUCTION_4X]
base = "{BLACK}Current production: {YELLOW}Gung-ho {}{}{BLACK}To keep this level, deliver {SKIP}{SIGNED_WORD} crates of supplies at least once every three minutes."

[STR_PORT_PRODUCTION_1X]
base = "{BLACK}Current production: {YELLOW}Normal {}{}{BLACK}For {WHITE}Enhanced {BLACK}production deliver {SIGNED_WORD} units of cargo at least once every three minutes.{}For {WHITE}Gung-ho {BLACK}production deliver {SIGNED_WORD} units."

[STR_PORT_PRODUCTION_2X]
base = "{BLACK}Current production: {YELLOW}Enhanced {}{}{BLACK}To keep this level, deliver {SIGNED_WORD} units of cargo at least once every three minutes.{}For {WHITE}Gung-ho {BLACK}production deliver {SIGNED_WORD} units."

[STR_PORT_PRODUCTION_4X]
base = "{BLACK}Current production: {YELLOW}Gung-ho {}{}{BLACK}To keep this level, deliver {SKIP}{SIGNED_WORD} units of cargo at least once every three minutes."

